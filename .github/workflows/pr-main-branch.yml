name: Validar PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: huellitas-org
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Instalar sfdx-git-delta y Code Analyzer
        run: |
          echo y | sf plugins install sfdx-git-delta
          echo y | sf plugins install @salesforce/plugin-code-analyzer

      - name: Guardar la llave JWT
        env:
          JWT_KEY: ${{ secrets.ORG_JWT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/jwt"
          printf '%s\n' "$JWT_KEY" > "$RUNNER_TEMP/jwt/server.key"
          chmod 600 "$RUNNER_TEMP/jwt/server.key"

      - name: Autenticar contra la org
        env:
          ORG_CLIENT_ID: ${{ secrets.ORG_CLIENT_ID }}
          ORG_USERNAME: ${{ secrets.ORG_USERNAME }}
          ORG_INSTANCE_URL: ${{ secrets.ORG_INSTANCE_URL }}
        run: |
          sf org login jwt \
            --client-id "$ORG_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/jwt/server.key" \
            --username "$ORG_USERNAME" \
            --instance-url "$ORG_INSTANCE_URL" \
            --alias org \
            --set-default

      - name: Code Analyzer
        run: |
          if find force-app -type f -print -quit | grep -q .; then
            sf code-analyzer run --workspace force-app --view table
          else
            echo "force-app no tiene archivos. No hay nada que analizar."
          fi

      - name: Calcular el delta contra main
        run: |
          mkdir -p delta
          sf sgd source delta \
            --to HEAD \
            --from origin/main \
            --output-dir delta \
            --generate-delta \
            --ignore-whitespace \
            --ignore .sgdignore
          if grep -q "<types>" delta/package/package.xml; then
            echo "MODO=delta" >> "$GITHUB_ENV"
            cat delta/package/package.xml
          else
            echo "MODO=vacio" >> "$GITHUB_ENV"
          fi
          if [ -f delta/destructiveChanges/destructiveChanges.xml ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            echo "DESTRUCTIVE=si" >> "$GITHUB_ENV"
          else
            echo "DESTRUCTIVE=no" >> "$GITHUB_ENV"
          fi

      - name: Validar el delta
        if: env.MODO == 'delta' && env.DESTRUCTIVE == 'no'
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --test-level NoTestRun \
            --target-org org \
            --wait 30

      - name: Validar el delta con borrados
        if: env.MODO == 'delta' && env.DESTRUCTIVE == 'si'
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --test-level NoTestRun \
            --target-org org \
            --wait 30

      - name: Nada que validar
        if: env.MODO == 'vacio'
        run: echo "El pull request no trae metadata nueva ni modificada."